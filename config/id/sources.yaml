# Kilder til den ugentlige ID-branchebrief.
#
# Alle kilder herunder er bekræftet med "check sources" (profile=id) 17. september 2026.
# Kør workflowet igen efter hver ændring. Vil du teste en enkelt kandidat uden at røre
# filen: python scripts/check_feeds.py --url https://dinkandidat.dk/feed
#
# Tre ting ligger bevidst udenfor:
# - Betalingsmure (Børsen, Finans, Ecotextile-artikler, PSI Journal, Digital Commerce 360
#   rapporter). Vi tager overskrifter med hvor feedet er åbent, ellers ingenting.
# - Private konkurrenters hjemmesider (Mascot, Kentaur, Engel, Tee Jays, Blåkläder). De har
#   ingen feeds. De kommer med i fase 3 som web watch.
# - CVR-regnskaber. Separat script, kvartalsvis.

rss:
  # Konkurrenter, børsnoterede. Det stærkeste signal i hele listen.
  - { name: "New Wave Group (MFN)", url: "https://mfn.se/all/a/new-wave-group.rss" }
  - { name: "Latour (MFN, dækker Fristads og Snickers)", url: "https://mfn.se/all/a/latour.rss" }

  # Promotion- og dekorationsbranchen
  - { name: "eppi magazine", url: "https://www.eppi-online.com/feed" }
  - { name: "Werbeartikel Nachrichten", url: "https://www.werbeartikel-verlag.de/feed" }
  - { name: "Printwear & Promotion", url: "https://printwearandpromotion.co.uk/feed/" }
  - { name: "FESPA", url: "https://www.fespa.com/en/rss" }
  - { name: "PPAI Media", url: "https://www.ppai.org/feed/" }

  # Tekstil, sourcing og regulering
  - { name: "Ecotextile News", url: "https://www.ecotextile.com/feed" }
  - { name: "Just Style", url: "https://www.just-style.com/feed/" }
  - { name: "Apparel Insider", url: "https://apparelinsider.com/feed/" }

  # Dansk industri og e-handel
  - { name: "Ecommerce News Europe", url: "https://ecommercenews.eu/feed/" }

  # Nyhedsbreve uden feed. Opret en feed-adresse på kill-the-newsletter.com, tilmeld dig
  # med den, og sæt URL'en ind her:
  # - { name: "DM&T nyhedsbrev", url: "https://kill-the-newsletter.com/feeds/XXXX.xml" }
  # - { name: "WA eLETTER", url: "https://kill-the-newsletter.com/feeds/XXXX.xml" }
  # - { name: "Handelsblatt Morning Briefing", url: "https://kill-the-newsletter.com/feeds/XXXX.xml" }
  #
  # Google Alerts. Opret hver søgning på google.com/alerts, sæt levering til "RSS feed",
  # kopiér feed-URL'en ind her. Forslag til søgestrenge:
  #   "New Wave Group" (regnskab OR opkøb) | Mascot arbejdstøj | Kentaur OR "F. Engel"
  #   profilbeklædning OR firmatøj | "digitalt produktpas" tekstil
  #   Berufsbekleidung Hersteller (Übernahme OR Fusion) | Digital Product Passport textiles
  # - { name: "Alert: konkurrenter DK", url: "https://www.google.com/alerts/feeds/XXXX/YYYY" }

  # Fjernet 17. september 2026 efter to kilde-tjek. Årsag i parentes:
  #   nwg.se/en/feed (404, MFN dækker New Wave Group), Gildan (404, kun watchlist),
  #   Images Magazine (serverens TLS afviser GitHubs servere), ASI Central (redirect-løkke),
  #   Textination, Dansk Erhverv, Lifestyle & Design Cluster, PSI Network, Future Commerce,
  #   The B2B eCommerce Show (404 på alle de URL-mønstre vi kender).
  #
  # Tre kilder svarer med en almindelig webside i stedet for et feed, både som bot og som
  # browser, så det er ikke bot-beskyttelse. Deres rigtige feed-adresse skal findes i hånden:
  #   Sourcing Journal (sourcingjournal.com/feed/), Dansk Mode & Textil (dmogt.dk/feed/),
  #   Kassenzone (kassenzone.de/feed/podcast/).
  # For DM&T er nyhedsbrevet formentlig nemmere: brug kill-the-newsletter.com.

podcasts:
  # Tom indtil vi finder feeds der virker. Kassenzone og Future Commerce svarede ikke
  # på de adresser vi prøvede. Tilføj en linje her når du har en rigtig feed-URL:
  #   - { name: "Kassenzone", feed: "...", max_minutes: 90, transcribe: false }
  # Hentes gratis fra shownotes. transcribe: true tænder fuld transskription (fase 2).
  []

web_watch:
  # Fase 3. Private konkurrenter uden feed. Slås til når vi tager Firecrawl i brug.
  - { name: "Mascot nyheder", url: "https://www.mascotworkwear.com/da-dk/news", mode: new_links }
  - { name: "Kentaur nyheder", url: "https://kentaur.com/da/nyheder/", mode: new_links }
  - { name: "Engel Workwear nyheder", url: "https://www.engel.eu/en/news", mode: new_links }
  - { name: "Tee Jays nyheder", url: "https://teejays.com/news", mode: new_links }
  - { name: "Blåkläder nyheder", url: "https://www.blaklader.se/nyheter", mode: new_links }
  - { name: "Stanley/Stella presse", url: "https://www.stanleystella.com/press", mode: new_links }

linkedin:
  enabled: false
  actor_id: "VERIFY"
  profiles: []

twitter:
  enabled: false
  handles: []
