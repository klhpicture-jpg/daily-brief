# Hvad jeg vil vide, i prioriteret rækkefølge.
# Rangeringen og skriveren ser filen ordret. Skriv den som en briefing til en skarp assistent.
me: >
  Marketing Manager hos Creative Force (workflow-platform til e-commerce content production i stor
  skala) og Dreem (virtuel, AI-genereret produktfoto til retailere). Jeg ejer go-to-market for det
  samlede tilbud til enterprise fashion-, beauty- og lifestyle-retailere med egne studier i Europa og
  Nordamerika. Jeg bygger selv AI-drevne outreach-systemer (Clay, n8n, HubSpot, Heyreach,
  coding agents), så jeg følger AI-modeller og agent-værktøjer som praktiker, ikke tilskuer. Jeg er
  dansk, arbejder med tyskere og andre europæere hver uge, og følger fodbold, Formel 1, cykling og
  tennis. Jeg læser det her på telefonen på to minutter. Giv mig det jeg kan handle på eller tale
  om i dag, ikke generelle nyheder. Alt skal skrives på dansk, uanset kildens sprog.

priorities:
  - name: AI-modeller og agent-værktøjer
    weight: high
    include: [nye frontier-modeller og sammenligninger, open-weight-modeller, Claude Code, Codex, Cursor, MCP, agent-frameworks, AI engineering, prompt injection og sikkerhedsfund der ændrer hvordan man bygger]
  - name: AI i marketing og content production
    weight: high
    include: [AI-billede og -video til produktindhold, virtuel fotografering, creative automation, AI i go-to-market og martech, SEO og AEO under AI-søgning]
  - name: Retail og e-commerce content operations
    weight: high
    include: [fashion- beauty- og lifestyle-retailere, in-house studier, produktindhold og PIM, B2B e-commerce, marketplaces, Shopify og platformændringer]
  - name: Europa og Tyskland
    weight: low
    include: [EU-regulering der konkret ændrer noget for e-commerce eller AI (AI Act, DSA, produktregler), tysk økonomi og erhvervsliv, det tyskere og danskere faktisk taler om socialt i denne uge]
    note: >
      Kun ting der ændrer min uge eller min næste samtale med en tysker. Ikke løbende dækning.
      Én god forklarende historie om ugen slår ti breaking-nyheder.
  - name: Sport
    weight: medium
    include: [fodbold (Premier League, Bundesliga, Superliga, landsholdet), Formel 1, cykling og danske ryttere, tennis Grand Slams, historien bag resultatet frem for resultatet selv]

exclude:
  - breaking news og løbende dækning af krig, konflikter, angreb og forhandlinger. Det ændrer sjældent min hverdag. Score 1 medmindre det direkte rammer europæisk erhvervsliv eller forsyningskæder
  - EU-topmøder, udtalelser, forslag og diplomati uden en vedtaget beslutning der rammer e-commerce, AI eller tysk erhvervsliv
  - dagsaktuel partipolitik, meningsmålinger og skandaler
  - funding-runder under 50M USD uden produktvinkel
  - amerikansk politik medmindre det ændrer EU- eller e-commerce-regler
  - generiske "AI ændrer alt"-klummer uden konkret indhold
  - pressemeddelelser og sponsoreret indhold uden ny information
  - kampreferater og resultater uden en historie bag
  - transferrygter uden navngiven kilde
