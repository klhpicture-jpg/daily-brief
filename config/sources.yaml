# Sources. Add a line, commit, done. No code changes needed.
# A broken source never kills the run: it shows up in the page footer instead.
#
# Rules of thumb:
# - RSS is free. Add as many as you like, the ranker filters.
# - Podcasts are collected from their show notes for free. Transcription (phase 2)
#   is opt-in per show with `transcribe: true`, roughly 0.02 USD per 10 minutes.
# - Email-only newsletters need a bridge: create a feed at kill-the-newsletter.com,
#   subscribe with the address it gives you, paste the Atom URL here.
# - Paywalled sites are left out. Most of their podcasts are free and listed below.
#
# Run the "check sources" workflow after editing (Actions tab).
# Everything below passed that check on 2026-09-16 unless marked VERIFY.

