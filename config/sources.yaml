podcasts:
  # Collected from show notes today. `transcribe: true` turns on full transcription in phase 2.
  # Episodes longer than max_minutes are never transcribed.
  # api.substack.com podcast feeds answer 403; Substack main feeds (Latent Space, Lenny) carry the episodes too.
  # The Cycling Podcast: no Acast feed found at the slug tried (VERIFY the real one).
  - { name: "The AI Daily Brief", feed: "https://anchor.fm/s/f7cac464/podcast/rss", max_minutes: 30, transcribe: true }
  - { name: "Lenny's Newsletter and Podcast", feed: "https://www.lennysnewsletter.com/feed", max_minutes: 90, transcribe: false }
  - { name: "Dwarkesh Podcast", feed: "https://www.dwarkesh.com/feed", max_minutes: 120, transcribe: false }
