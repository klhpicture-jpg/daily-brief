name: check sources

on:
  workflow_dispatch:
    inputs:
      profile:
        description: "Which brief's sources to check"
        type: choice
        options: [daily, id]
        default: daily

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every feed in the profile's sources.yaml
        run: python scripts/check_feeds.py --profile ${{ inputs.profile }}
