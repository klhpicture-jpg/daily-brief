name: id weekly

on:
  schedule:
    # Target: Monday 07:25 Europe/Copenhagen. Cron is UTC and ignores DST, so both
    # candidate hours fire and scripts/gate.py lets exactly one through. A late start
    # still delivers, any time on Monday from 07:00 local.
    - cron: "25 5 * * 1"   # 07:25 CEST (summer)
    - cron: "25 6 * * 1"   # 07:25 CET (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No delivery, no state write"
        type: boolean
        default: false
      since:
        description: "Collect items published after this date (YYYY-MM-DD). Empty = since last run."
        type: string
        default: ""
      ignore_seen:
        description: "Include items already shown before (for testing the writing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: id-weekly
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DELIVERY_CHANNEL: ${{ vars.DELIVERY_CHANNEL || 'telegram' }}
      OPENAI_RANK_MODEL: ${{ vars.OPENAI_RANK_MODEL || 'gpt-5-nano' }}
      OPENAI_WRITE_MODEL: ${{ vars.OPENAI_WRITE_MODEL || 'gpt-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Decide whether this slot runs
        id: gate
        run: python3 scripts/gate.py --marker state/id/last_scheduled.txt --from-hour 7 --weekly --weekday 0 >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Build and deliver the weekly industry brief
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m src.main --profile id
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.ignore_seen == true && '--ignore-seen' || '' }}
          ${{ inputs.since != '' && format('--since {0}', inputs.since) || '' }}

      - name: Record this week's scheduled delivery
        if: steps.gate.outputs.run == 'true' && github.event_name == 'schedule' && inputs.dry_run != true
        run: echo "${{ steps.gate.outputs.period }}" > state/id/last_scheduled.txt

      - name: Commit state and pages
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          git config user.name "daily-brief bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Publish ID weekly $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push failed, retry $attempt"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Message me that it failed
        if: failure() && steps.gate.outputs.run == 'true'
        run: python -m src.deliver --failure --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
