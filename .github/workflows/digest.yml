name: digest

on:
  schedule:
    # Target: 18:25 Europe/Copenhagen every day, message on the phone around 18:28.
    # Cron is UTC and ignores DST, so both candidate hours fire and the
    # "Only run at 18 local" step lets exactly one of them through.
    - cron: "25 16 * * *"   # 18:25 CEST (summer)
    - cron: "25 17 * * *"   # 18:25 CET (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "No delivery, no state write"
        type: boolean
        default: false
      since:
        description: "Collect items published after this date (YYYY-MM-DD). Empty = since last run."
        type: string
        default: ""
      ignore_seen:
        description: "Include items already shown before (for testing the writing)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
      TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
      TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
      TWILIO_TO: ${{ secrets.TWILIO_TO }}
      TWILIO_CONTENT_SID: ${{ secrets.TWILIO_CONTENT_SID }}
      DELIVERY_CHANNEL: ${{ vars.DELIVERY_CHANNEL || 'telegram' }}
      OPENAI_RANK_MODEL: ${{ vars.OPENAI_RANK_MODEL || 'gpt-5-nano' }}
      OPENAI_WRITE_MODEL: ${{ vars.OPENAI_WRITE_MODEL || 'gpt-5' }}
      OPENAI_TRANSCRIBE_MODEL: ${{ vars.OPENAI_TRANSCRIBE_MODEL || 'gpt-4o-mini-transcribe' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Only run at 18 local time (Europe/Copenhagen)
        id: gate
        run: |
          hour=$(TZ=Europe/Copenhagen date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "18" ]; then
            echo "local hour is $hour, not 18, skipping this cron slot"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v6
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        if: steps.gate.outputs.run == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Ensure feedback labels exist
        if: steps.gate.outputs.run == 'true'
        continue-on-error: true
        run: python scripts/ensure_labels.py

      - name: Build and deliver the digest
        if: steps.gate.outputs.run == 'true'
        run: >-
          python -m src.main
          ${{ inputs.dry_run == true && '--dry-run' || '' }}
          ${{ inputs.ignore_seen == true && '--ignore-seen' || '' }}
          ${{ inputs.since != '' && format('--since {0}', inputs.since) || '' }}

      - name: Commit state and pages
        if: steps.gate.outputs.run == 'true' && inputs.dry_run != true
        run: |
          git config user.name "daily-brief bot"
          git config user.email "actions@users.noreply.github.com"
          git add state docs config/learned.md 2>/dev/null || git add state docs
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Publish digest $(date -u +%Y-%m-%d) [skip ci]"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push failed, retry $attempt"
            sleep $((attempt * 5))
          done
          exit 1

      - name: Message me that it failed
        if: failure() && steps.gate.outputs.run == 'true' 
        run: python -m src.deliver --failure --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
