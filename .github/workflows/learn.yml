name: learn

on:
  schedule:
    - cron: "0 6 * * 1"   # Monday, after the digest
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_WRITE_MODEL: ${{ vars.OPENAI_WRITE_MODEL || 'gpt-5' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/ensure_labels.py
      - name: Fold feedback issues into learned.md
        run: python scripts/collect_feedback.py
      - name: Commit learned rules
        run: |
          git config user.name "daily-brief bot"
          git config user.email "actions@users.noreply.github.com"
          git add config/learned.md
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Update learned rules from feedback [skip ci]"
          git pull --rebase origin main && git push origin HEAD:main
